name: Deploy to EC2 🚀

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (auth, mngr, compiler, web, all)'
        required: true
        default: 'all'

env:
  DEPLOY_DIR: ~/assessment-platform
  GITHUB_ORG: guillermorodgom

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine service to deploy
        id: target
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            REPO="${{ github.event.client_payload.repo }}"
            REPO_NAME="${REPO##*/}"
            case "$REPO_NAME" in
              assessment-platform-auth)     echo "service=auth" >> $GITHUB_OUTPUT; echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT ;;
              assessment-platform-mngr)     echo "service=mngr" >> $GITHUB_OUTPUT; echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT ;;
              assessment-platform-compiler) echo "service=compiler" >> $GITHUB_OUTPUT; echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT ;;
              assessment-platform-web-ui)   echo "service=web" >> $GITHUB_OUTPUT; echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT ;;
              *)                            echo "service=all" >> $GITHUB_OUTPUT; echo "repo=all" >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "service=${{ github.event.inputs.service }}" >> $GITHUB_OUTPUT
            echo "repo=all" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          SERVICE="${{ steps.target.outputs.service }}"
          REPO="${{ steps.target.outputs.repo }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << DEPLOY_SCRIPT
            set -e
            DEPLOY_DIR=~/assessment-platform
            GITHUB_ORG=guillermorodgom
            SERVICE="$SERVICE"
            REPO="$REPO"

            mkdir -p \$DEPLOY_DIR
            cd \$DEPLOY_DIR

            if [ "\$REPO" = "all" ]; then
              REPOS="assessment-platform-infra assessment-platform-auth assessment-platform-mngr assessment-platform-compiler assessment-platform-web-ui assessment-platform-database"
            else
              REPOS="\$REPO"
            fi

            # Pull only the changed repo(s)
            for R in \$REPOS; do
              if [ -d "\$R" ]; then
                echo "=== Pulling \$R ==="
                git -C \$R pull origin main
              else
                echo "=== Cloning \$R ==="
                git clone https://github.com/\$GITHUB_ORG/\$R.git
              fi
            done

            # Ensure .env exists
            cd assessment-platform-infra
            cat > .env << EOF
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JUDGE0_API_KEY=${{ secrets.JUDGE0_API_KEY }}
          EOF

            # Build and deploy only the changed service
            if [ "\$SERVICE" = "all" ]; then
              echo "=== Building all services ==="
              docker compose build --no-cache
              docker compose up -d
            else
              echo "=== Building \$SERVICE ==="
              docker compose build --no-cache \$SERVICE
              docker compose up -d --no-deps \$SERVICE
            fi

            echo "=== Deploy complete ==="
            docker compose ps
            docker image prune -f
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
